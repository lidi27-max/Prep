<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warm-up: Make It Polite</title>
<style>
:root{--navy:#002060;--teal:#1C7293;--pale:#E8EEF8;--ok:#1b7a3d;--bad:#b3261e}
*{box-sizing:border-box}
body{font-family:Calibri,Arial,sans-serif;margin:0;background:#f5f7fb;color:#1a1a1a}
header{background:var(--navy);color:#fff;padding:14px 22px}
header h1{margin:0;font-size:22px}header p{margin:4px 0 0;font-size:14px;opacity:.85}
main{max-width:760px;margin:0 auto;padding:18px}
.prog{height:8px;background:#d5dbe8;border-radius:4px;margin:6px 0 14px}.prog div{height:8px;background:var(--teal);border-radius:4px;width:0}
.card{background:#fff;border:1px solid #d5dbe8;border-radius:10px;padding:18px}
.sit{background:var(--pale);border-radius:8px;padding:10px 12px;margin-bottom:12px;line-height:1.4}
.q{font-size:18px;margin:6px 0 12px;line-height:1.4}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #c3cde3;border-radius:8px;padding:11px 13px;margin:8px 0;font-size:17px;cursor:pointer;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt.ok{border-color:var(--ok);background:#eaf6ee}
.opt.bad{border-color:var(--bad);background:#fdecea}
.fb{margin-top:12px;padding:10px 12px;border-radius:8px;display:none;line-height:1.45}
.fb.show{display:block;background:#f4f6fb;border-left:4px solid var(--teal)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
button.act{background:var(--navy);color:#fff;border:0;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:16px}
button.act:disabled{opacity:.4;cursor:default}
.score{font-size:40px;font-weight:700;color:var(--navy)}
</style></head><body>
<header><h1>Warm-Up: Make It Polite</h1><p>Choose the best sentence for each email situation. Discuss your choice with your partner before you click.</p></header>
<main><div class="prog"><div id="bar"></div></div><div class="card" id="card"></div></main>
<script>
const Q=[
{s:"You are writing to your professor. You missed the deadline and need more time.",q:"Which sentence is the most appropriate?",
 o:["Give me more time for the essay.","I would be grateful if you could give me more time for the essay.","You must give me more time for the essay."],a:1,
 e:"A polite request uses I would be grateful if + you could + verb. The other two are direct commands."},
{s:"You are writing to the student activities office. You do not know where the club fair is.",q:"Which sentence has the correct word order?",
 o:["Could you tell me where is the club fair?","Could you tell me where the club fair is?","Could you tell me where does the club fair take place?"],a:1,
 e:"An embedded question keeps normal order (where + subject + verb): no inversion and no do/does/did. You practiced this in Build a Sentence."},
{s:"You are starting an email to a campus office about the course schedule.",q:"Which opening is the best?",
 o:["Hey, what's the schedule?","I wanna know the schedule.","I am writing to enquire about the course schedule."],a:2,
 e:"I am writing to + verb states the purpose clearly and politely. Hey and wanna are too casual for an office."},
{s:"You are reporting a problem with the online registration page.",q:"Which sentence sounds professional?",
 o:["Your page is broken and nobody fixes it.","Fix the page now.","I encountered a problem with the registration page, and I would appreciate your help."],a:2,
 e:"Describe the problem without blaming anyone, then make a polite request. Accusations lower the social-conventions score."},
{s:"You are ending an email to a professor.",q:"Which closing is the best?",
 o:["Reply me fast.","I look forward to hearing from you.","Bye."],a:1,
 e:"A polite closing line plus your name finishes the email. Also: write Please reply as soon as possible, not ASAP."},
{s:"Complete the polite request.",q:"I would be grateful if you ___ me some more information about the program.",
 o:["can sent","could send","would have sent"],a:1,
 e:"I would be grateful if + you could + base verb. Could makes the request softer than can."},
{s:"Complete the sentence to a housing office.",q:"I was wondering ___ possible to change my room reservation.",
 o:["is it","that it is","whether it is"],a:2,
 e:"I was wondering + if / whether + subject + verb. It is an embedded yes/no question: normal order, so it is, not is it."},
{s:"Complete the sentence to a classmate you do not know well.",q:"I would appreciate it if you ___ me know by Friday.",
 o:["would let","will let","let"],a:0,
 e:"I would appreciate it if you would / could + base verb. Will and the bare verb are too direct here."}
];
let i=0,score=0,done=false;
const card=document.getElementById('card'),bar=document.getElementById('bar');
function show(){
 done=false;const x=Q[i];bar.style.width=(i/Q.length*100)+'%';
 card.innerHTML='<div class="sit"><b>'+(i+1)+' / '+Q.length+'</b> · '+x.s+'</div><div class="q">'+x.q+'</div><div id="opts"></div><div class="fb" id="fb"></div><div class="row"><span></span><button class="act" id="next" disabled>'+(i===Q.length-1?'See my score':'Next')+'</button></div>';
 const ord=x.o.map((t,k)=>({t,k})).sort(()=>Math.random()-.5);
 const box=document.getElementById('opts');
 ord.forEach(({t,k})=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.dataset.k=k;b.onclick=()=>pick(b,k);box.appendChild(b)});
 document.getElementById('next').onclick=()=>{i++;i<Q.length?show():end()};
}
function pick(b,k){
 if(done)return;done=true;const x=Q[i];
 document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.k===x.a)o.classList.add('ok')});
 if(k===x.a)score++;else b.classList.add('bad');
 const fb=document.getElementById('fb');fb.className='fb show';fb.innerHTML='<b>'+(k===x.a?'Correct.':'Not quite.')+'</b> '+x.e;
 document.getElementById('next').disabled=false;
}
function end(){
 bar.style.width='100%';
 card.innerHTML='<div style="text-align:center"><div class="score">'+score+' / '+Q.length+'</div><p style="font-size:18px">Polite emails use hedged requests, embedded questions and a clear opening and closing.</p><button class="act" onclick="i=0;score=0;show()">Try again</button></div>';
}
show();
</script></body></html>
